name: Upstream Sync (Safe Automatic Merge)

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync upstream and publish
        env:
          UPSTREAM_REPO: srcrs/rss-reader
          UPSTREAM_BRANCH: main
          FORK_BRANCH: main
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"
          fork_head="$(git rev-parse HEAD)"
          backup_tag="upstream-sync-backup-${GITHUB_RUN_ID}"
          git tag "${backup_tag}" HEAD
          git push origin "${backup_tag}"
          set +e
          git merge --no-ff --no-commit -X ours "upstream/${UPSTREAM_BRANCH}"
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            echo "Merge conflicts detected; preserving fork files."
            conflict_file=$(mktemp)
            git diff --name-only --diff-filter=U -z > "$conflict_file"
            git checkout --ours -- . 2>/dev/null || true
            git add -A
            while IFS= read -r -d '' path; do
              if ! git cat-file -e "${fork_head}:${path}" 2>/dev/null; then
                git rm -f -- "$path" 2>/dev/null || true
              fi
            done < "$conflict_file"
            rm -f "$conflict_file"
            git add -A
          fi
          while IFS= read -r path; do
            if git cat-file -e "${fork_head}:${path}" 2>/dev/null; then
              git checkout "${fork_head}" -- "$path"
            else
              git rm -f -- "$path" 2>/dev/null || true
            fi
          done < <(git diff --name-only "${fork_head}" -- .github/workflows)
          git add -A -- .github/workflows
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-edit -m "chore: sync upstream ${UPSTREAM_BRANCH} while preserving fork changes"
          fi
          git diff --check
          git push origin "HEAD:${FORK_BRANCH}"
